# Dependency advisory policy for tools/dependency_audit.py.
# See docs/dependency-security.md for how to read and change this file.
#
# Every exception names the exact package version, advisories, Python versions
# and (optionally) dependency scopes it covers, plus a dated review. An
# exception that expires, or a new advisory/version/Python lane it does not
# cover, fails the audit.

[audit]
# Supported interpreters (pyproject.toml: python = ">=3.9,<3.13").
python_versions = ["3.9", "3.10", "3.11", "3.12"]
platforms = ["linux", "darwin", "win32"]
# Scopes whose advisories block. Development and documentation groups are
# reported only: they never ship to Brickflow users.
blocking_scopes = ["runtime", "extra:*"]

# ---------------------------------------------------------------------------
# Security floors. The audit checks the lockfile against them and the
# `installed` subcommand checks real environments against them.
# ---------------------------------------------------------------------------

[[floor]]
package = "certifi"
minimum = "2026.10.18"
reason = "GHSA-6q48-6c7w-9gw2: compromised emSign intermediate CA keys."

[[floor]]
package = "urllib3"
minimum = "2.8.0"
python = ["3.10", "3.11", "3.12"]
reason = "Streaming decompression, chunk parsing and proxy TLS advisories fixed through 2.8.0."

[[floor]]
package = "urllib3"
minimum = "1.26.20"
python = ["3.9"]
reason = "Newest release compatible with botocore and snowflake-connector-python on Python 3.9."

[[floor]]
package = "requests"
minimum = "2.33.0"
python = ["3.10", "3.11", "3.12"]
reason = "GHSA-9hjg-9r4m-mvj7 and GHSA-gc5v-m9x4-r6x2."

[[floor]]
package = "requests"
minimum = "2.32.4"
python = ["3.9"]
reason = "GHSA-9hjg-9r4m-mvj7; 2.33.0 requires Python 3.10."

[[floor]]
package = "jinja2"
minimum = "3.1.6"
reason = "GHSA-cpwx-vrp4-4pq7."

[[floor]]
package = "tableauserverclient"
minimum = "0.41"
python = ["3.10", "3.11", "3.12"]
reason = "Moves the Tableau extra off the urllib3 1.26 pin (DEP-02)."

[[floor]]
package = "snowflake-connector-python"
minimum = "3.18.1"
python = ["3.9"]
reason = "GHSA-5cc2-282f-jjq2 (TLS hostname verification); 4.7.3 requires Python 3.10."

[[floor]]
package = "snowflake-connector-python"
minimum = "4.7.3"
python = ["3.10", "3.11", "3.12"]
reason = "GHSA-5cc2-282f-jjq2 (fixed in 4.7.1) and GHSA-qqj6-54q6-cxv6 (fixed in 4.7.3)."

[[floor]]
package = "cryptography"
minimum = "50.0.0"
python = ["3.10", "3.11", "3.12"]
reason = "Bundled OpenSSL, PKCS#7, path-building, name-constraint and subgroup advisories fixed through 50.0.0."

[[floor]]
package = "pyopenssl"
minimum = "26.0.0"
python = ["3.10", "3.11", "3.12"]
reason = "GHSA-5pwr-322w-8jr4 and GHSA-vp96-hxj8-p424."

[[floor]]
package = "filelock"
minimum = "3.20.3"
python = ["3.10", "3.11", "3.12"]
reason = "GHSA-qmgc-5h2g-mvrw and GHSA-w853-jp5j-5j7f."

# ---------------------------------------------------------------------------
# Python 3.9: blocked by other supported extras, not fixed.
# ---------------------------------------------------------------------------

[[exception]]
package = "urllib3"
scopes = ["runtime", "extra:all-plugins", "extra:box", "extra:cerberus", "extra:snowflake", "extra:tableau"]
versions = ["1.26.20"]
python = ["3.9"]
advisories = [
    "GHSA-2xpw-w6gg-jr37",
    "GHSA-gm62-xv2j-4w53",
    "GHSA-38jv-5279-wg99",
    "GHSA-vxq7-64xx-v4gw",
    "GHSA-pq67-6m6q-mj2v",
    "GHSA-qccp-gfcp-xxvc",
    "GHSA-8988-9cw3-xx77",
]
classification = "compatibility-blocked"
review_by = 2027-01-31
reason = """
Python 3.9 lane only. Every botocore release (cerberus extra) and every
snowflake-connector-python release (snowflake extra) that still supports
Python 3.9 requires urllib3 < 2 there, so the shared lock cannot move.
These advisories are reachable: Brickflow's artifact download streams through
requests/urllib3, so a malicious or compromised artifact endpoint can drive the
decompression and chunk-parsing flaws (2xpw, gm62, 38jv, vxq7). A pip install
on Python 3.9 without the snowflake or cerberus extras resolves urllib3 2.6.3,
which fixes 2xpw, gm62, 38jv and pq67. Full remediation needs Python 3.10+.
"""

[[exception]]
package = "requests"
scopes = ["runtime", "extra:all-plugins", "extra:box", "extra:cerberus", "extra:snowflake", "extra:tableau"]
versions = ["2.32.5"]
python = ["3.9"]
advisories = ["GHSA-gc5v-m9x4-r6x2"]
classification = "compatibility-blocked"
review_by = 2027-01-31
reason = """
Python 3.9 lane only; requests 2.33.0 requires Python 3.10. The advisory
affects extract_zipped_paths(), which requests uses only when its CA bundle is
inside a zip archive. Brickflow does not call it or ship zipped CA bundles.
"""

# ---------------------------------------------------------------------------
# Snowflake extra. Python 3.10-3.12 resolve connector 4.8.0, cryptography
# 50.0.2 and pyOpenSSL 26.4.0, which have no open advisories. What remains is
# Python 3.9, where no fixed release installs, and filelock, which the 4.x
# connector caps below 4.
# ---------------------------------------------------------------------------

[[exception]]
package = "snowflake-connector-python"
versions = ["3.18.1"]
python = ["3.9"]
scopes = ["extra:snowflake", "extra:all-plugins"]
advisories = ["GHSA-qqj6-54q6-cxv6"]
classification = "compatibility-blocked"
review_by = 2027-01-31
reason = """
Python 3.9 lane only. 3.18.1 fixes GHSA-5cc2-282f-jjq2, but the log-redaction
fix for GHSA-qqj6 exists only in 4.7.3+, which requires Python 3.10; 4.0-4.5
still install on 3.9 and are vulnerable to GHSA-5cc2, so 3.9 stays on 3.18.x.
Reachable when the Snowflake operators connect and connector logging reaches
DEBUG (SQL text, result-encryption keys) or certain ERROR paths: anyone who
can read those logs may obtain session tokens or keys. Brickflow does not
raise the connector's log level. Fixed by moving the job to Python 3.10+.
"""

[[exception]]
package = "cryptography"
versions = ["43.0.3"]
python = ["3.9"]
scopes = ["extra:snowflake", "extra:all-plugins"]
advisories = [
    "GHSA-537c-gmf6-5ccf",
    "GHSA-79v4-65xg-pq4g",
    "GHSA-jwv3-5hgf-82ww",
    "GHSA-m2h6-j472-rp4c",
    "GHSA-m959-cc7f-wv43",
    "GHSA-r6ph-v2qm-q3c2",
]
classification = "compatibility-blocked"
review_by = 2027-01-31
reason = """
Python 3.9 lane only. cryptography 44+ excludes Python 3.9.0 and 3.9.1, and
connector 3.18.x requires pyOpenSSL < 26, which caps cryptography below 47;
the fixes for 537c (bundled OpenSSL, reachable through the connector's TLS
and OCSP code) and jwv3 need 48.0.1/49.0.0. A fresh pip install on 3.9.2+
gets pyOpenSSL 25.3.0 with cryptography 46.0.0 (46.0.1+ needs cffi 2, which
the connector excludes), which still has 537c and jwv3. m2h6 is
listed because PYSEC-2026-3554 marks every release below 49.0.0 as affected
(the GHSA record starts at 45.0.0). Fixed on Python 3.10+ (50.0.2 in the
lock).
"""

[[exception]]
package = "pyopenssl"
versions = ["24.3.0"]
python = ["3.9"]
scopes = ["extra:snowflake", "extra:all-plugins"]
advisories = ["GHSA-5pwr-322w-8jr4", "GHSA-vp96-hxj8-p424"]
classification = "compatibility-blocked"
review_by = 2027-01-31
reason = """
Python 3.9 lane only: connector 3.18.x requires pyOpenSSL < 26 and the fixes
are in 26.0.0. Neither Brickflow nor the connector uses DTLS cookie callbacks
(5pwr) or a servername callback (vp96). Fixed on Python 3.10+ (26.4.0).
"""

[[exception]]
package = "filelock"
versions = ["3.19.1"]
python = ["3.9"]
scopes = ["extra:snowflake", "extra:all-plugins"]
advisories = [
    "GHSA-69hj-f68j-2879",
    "GHSA-8mx5-7m5m-r77g",
    "GHSA-qmgc-5h2g-mvrw",
    "GHSA-w853-jp5j-5j7f",
]
classification = "compatibility-blocked"
review_by = 2027-01-31
reason = """
Python 3.9 lane only: 3.19.1 is the newest filelock for Python 3.9. The
connector locks its OCSP/CRL cache with FileLock; these are local races and
symlink or permission issues in that cache directory, exploitable by another
local user who can write there. 8mx5 is Windows-only.
"""

[[exception]]
package = "filelock"
versions = ["3.20.3"]
python = ["3.10", "3.11", "3.12"]
scopes = ["extra:snowflake", "extra:all-plugins"]
advisories = ["GHSA-69hj-f68j-2879", "GHSA-8mx5-7m5m-r77g"]
classification = "deferred-upgrade"
review_by = 2027-01-31
reason = """
Both are fixed only in filelock 4.2.1, which requires Python 3.11, and
snowflake-connector-python 4.x requires filelock < 4. Connector 5.x drops
filelock but is a separate major upgrade that requires Python 3.11, so
Python 3.10 has no fixed route. The connector uses FileLock only on its
OCSP/CRL cache: 69hj needs another local user who can rename or link files
in that directory; 8mx5 is Windows-only. The lock keeps 3.20.3, the newest
release before the ReadWriteLock/SoftFileLock code that has further
advisories.
"""
