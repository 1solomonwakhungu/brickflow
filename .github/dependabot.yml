# Dependabot reads this file from the default branch. On a fork, version
# updates stay off until the repository owner enables them in the repository
# settings; see docs/publication-readiness.md.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs. Dependabot proposes new
  # releases and keeps the trailing version comments in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Base image of the development Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  # Python dependencies: version-update pull requests are disabled because
  # pyproject.toml floors and poetry.lock are maintained deliberately alongside
  # the dependency audit. Security updates, when enabled in the repository
  # settings, use their own limit and are not affected by this value.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
