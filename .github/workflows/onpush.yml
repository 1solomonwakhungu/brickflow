name: build

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ main ]
  release:
    types: [ published ]

# Nothing is granted by default. Each job declares the permissions it needs.
# Actions are pinned to full commit SHAs and containers to image digests;
# Dependabot proposes updates (see .github/dependabot.yml). Publication rules
# and prerequisites are described in docs/publication-readiness.md.
permissions: {}

jobs:
  test-pipeline:
    name: test-pipeline (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
      options: --user 1001 # run as the runner user instead of root
    strategy:
      max-parallel: 2
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]
        os: [ ubuntu-latest ]
        include:
          - python-version: '3.9'
            image: python:3.9@sha256:da5aee29682d12a6649f51c8d6f15b87deb3e6c524b923c41d0cb3304d07c913
          - python-version: '3.10'
            image: python:3.10@sha256:c10791e6f69086d5216f7b5d3b839929c454e24305867ed9bc5152f0355b5423
          - python-version: '3.11'
            image: python:3.11@sha256:731670a425deabbc48d39f0ee3115cfa665b2a4002c19939ad3e88b2832b4549
          - python-version: '3.12'
            image: python:3.12@sha256:cad37dd20c7cac861af9003af8796d03ea7a998ec1e3a664429740fc9d7d2691

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK # used for py4j for cronutils
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install and configure Poetry (py3.9)
        if: matrix.python-version == '3.9'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: '1.8.5'

      - name: Install and configure Poetry
        if: matrix.python-version != '3.9'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Install poetry and build tools
        run: |
          export PATH=$PATH:$HOME/.local/bin
          poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install dependencies
        run: |
          export PATH=$PATH:$HOME/.local/bin
          make poetry

      - name: Install, lint and test
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export GITHUB_ACTIONS=true
          make cov

      # Pull requests from forks receive no secrets, so the token is empty there.
      - name: Publish test coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  # Builds and checks the distributions on every event, without any publishing
  # credential. On a release, the publish job uploads exactly these files.
  build-distributions:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: python:3.10@sha256:c10791e6f69086d5216f7b5d3b839929c454e24305867ed9bc5152f0355b5423
      options: --user 1001 # run as the runner user instead of root
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # poetry-dynamic-versioning derives the version from tags
          persist-credentials: false

      - name: Install build tools
        run: |
          python -m venv /tmp/build-tools
          /tmp/build-tools/bin/python -m pip install \
            "poetry==1.8.5" \
            "poetry-dynamic-versioning[plugin]==1.10.1" \
            "twine==7.0.0" \
            "certifi>=2026.10.18"

      # Checks the certificate bundle of this build tool environment. Uploads
      # do not run here: they run inside the PyPA publish action's own
      # container, whose dependencies and CA bundle this workflow does not
      # verify (see docs/publication-readiness.md).
      - name: Check build tool certificate bundle
        env:
          CERTIFI_FLOOR: "2026.10.18" # first release with the GHSA-6q48-6c7w-9gw2 fix
        run: |
          /tmp/build-tools/bin/python -I - <<'PY'
          import os
          import re
          import sys

          try:
              import certifi
          except ImportError:
              sys.exit("certifi is not installed in the build tool environment")

          def parse(version):
              if not re.fullmatch(r"[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}", version):
                  sys.exit("unexpected certifi version %r" % version)
              return tuple(int(part) for part in version.split("."))

          version = certifi.__version__
          bundle = os.path.realpath(certifi.where())
          prefix = os.path.realpath(sys.prefix) + os.sep
          if parse(version) < parse(os.environ["CERTIFI_FLOOR"]):
              sys.exit("certifi %s is older than %s" % (version, os.environ["CERTIFI_FLOOR"]))
          if not bundle.startswith(prefix):
              sys.exit("certifi bundle %s is outside the build tool environment" % bundle)
          with open(bundle, "rb") as handle:
              head = handle.read(4096)
          if b"-----BEGIN CERTIFICATE-----" not in head:
              sys.exit("certifi bundle %s does not contain a PEM certificate" % bundle)
          print("certifi %s, bundle %s" % (version, bundle))
          PY

      - name: Build distributions
        run: |
          rm -rf dist
          /tmp/build-tools/bin/poetry build --no-interaction

      - name: Check distributions
        run: |
          ls -l dist
          /tmp/build-tools/bin/twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Fails a release run, with the reasons, unless every publication
  # prerequisite this workflow can read is verifiably in place. A skipped
  # publish would otherwise look like success. This check reports readiness;
  # GitHub itself enforces the pypi environment's rules on the publish job.
  publication-readiness:
    name: Publication readiness
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read the pypi environment and its deployment rules
    steps:
      - name: Check publication readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GH_NO_UPDATE_NOTIFIER: "1"
          EXPECTED_REPOSITORY: Nike-Inc/brickflow
          # The only deployment rule the pypi environment may have: a tag
          # rule with exactly this name pattern, and no branch rules.
          EXPECTED_TAG_RULE: v*
          API_CALL_TIMEOUT_SECONDS: "30"
          API_DEADLINE_SECONDS: "120"
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          GIT_REF: ${{ github.ref }}
          READINESS_FLAG: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time

          API_VERSION = "2022-11-28"
          PER_PAGE = 100
          MAX_PAGES = 5
          MAX_RESPONSE_BYTES = 1024 * 1024
          RELEASE_TAG = re.compile(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"((a|b|rc)(0|[1-9][0-9]*))?"
          )
          REPOSITORY_NAME = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
          RULE_PATTERN = re.compile(r"[A-Za-z0-9_.*?-]+")


          class ApiError(Exception):
              pass


          def bounded_seconds(name, upper):
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9]{1,3}", value) or not 1 <= int(value) <= upper:
                  raise SystemExit("%s must be a whole number from 1 to %d" % (name, upper))
              return int(value)


          CALL_TIMEOUT = bounded_seconds("API_CALL_TIMEOUT_SECONDS", 60)
          DEADLINE = time.monotonic() + bounded_seconds("API_DEADLINE_SECONDS", 240)


          def is_count(value):
              return isinstance(value, int) and not isinstance(value, bool) and value >= 0


          def api_get(endpoint):
              """Return the JSON body of a successful GET, or raise ApiError."""
              remaining = DEADLINE - time.monotonic()
              if remaining <= 0:
                  raise ApiError("the time allowed for GitHub API requests ran out")
              command = [
                  "gh", "api", "--method", "GET",
                  "-H", "Accept: application/vnd.github+json",
                  "-H", "X-GitHub-Api-Version: " + API_VERSION,
                  endpoint,
              ]
              with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                  try:
                      process = subprocess.Popen(
                          command, stdin=subprocess.DEVNULL, stdout=out, stderr=err
                      )
                  except OSError as error:
                      raise ApiError("could not run gh: %s" % error.strerror)
                  try:
                      status = process.wait(timeout=min(CALL_TIMEOUT, remaining))
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
                      raise ApiError("GET %s timed out" % endpoint)
                  if status != 0:
                      err.seek(0)
                      detail = err.read(300).decode("utf-8", "replace").strip()
                      raise ApiError(
                          "GET %s failed with exit status %d%s"
                          % (endpoint, status, ": " + detail if detail else "")
                      )
                  size = out.seek(0, os.SEEK_END)
                  if size == 0:
                      raise ApiError("GET %s returned an empty response" % endpoint)
                  if size > MAX_RESPONSE_BYTES:
                      raise ApiError("GET %s returned more than %d bytes" % (endpoint, MAX_RESPONSE_BYTES))
                  out.seek(0)
                  try:
                      return json.loads(out.read().decode("utf-8"))
                  except ValueError:
                      raise ApiError("GET %s returned malformed JSON" % endpoint)


          def valid_reviewer(entry):
              if not isinstance(entry, dict) or entry.get("type") not in ("User", "Team"):
                  return False
              reviewer = entry.get("reviewer")
              return isinstance(reviewer, dict) and is_count(reviewer.get("id")) and reviewer["id"] > 0


          def reviewer_problems(environment):
              rules = environment.get("protection_rules")
              if not isinstance(rules, list) or not all(
                  isinstance(rule, dict) and isinstance(rule.get("type"), str) for rule in rules
              ):
                  return ["environment 'pypi' has malformed protection rules"]
              reviewer_rules = [rule for rule in rules if rule["type"] == "required_reviewers"]
              if not reviewer_rules:
                  return ["environment 'pypi' has no required reviewers rule"]
              for rule in reviewer_rules:
                  reviewers = rule.get("reviewers")
                  if not isinstance(reviewers, list) or not reviewers:
                      return ["environment 'pypi' has a required reviewers rule with no reviewers"]
                  if not all(valid_reviewer(entry) for entry in reviewers):
                      return ["environment 'pypi' has a malformed required reviewer"]
              return []


          def deployment_mode_problems(environment):
              policy = environment.get("deployment_branch_policy")
              if policy is None:
                  return ["environment 'pypi' allows deployments from every branch and tag"]
              if not isinstance(policy, dict) or not all(
                  isinstance(policy.get(key), bool)
                  for key in ("protected_branches", "custom_branch_policies")
              ):
                  return ["environment 'pypi' has a malformed deployment policy"]
              if policy["protected_branches"] or not policy["custom_branch_policies"]:
                  return ["environment 'pypi' does not limit deployments to selected tags"]
              return []


          def list_deployment_rules(endpoint):
              """Read every page of the environment's deployment rules."""
              rules = []
              total = None
              for page in range(1, MAX_PAGES + 1):
                  body = api_get("%s?per_page=%d&page=%d" % (endpoint, PER_PAGE, page))
                  items = body.get("branch_policies") if isinstance(body, dict) else None
                  count = body.get("total_count") if isinstance(body, dict) else None
                  if not is_count(count) or not isinstance(items, list) or len(items) > PER_PAGE:
                      raise ApiError("deployment rules page %d is malformed" % page)
                  if total is None:
                      total = count
                      if total > MAX_PAGES * PER_PAGE:
                          raise ApiError("more than %d deployment rules" % (MAX_PAGES * PER_PAGE))
                  elif count != total:
                      raise ApiError("the deployment rules changed while they were read")
                  rules.extend(items)
                  if len(rules) >= total or len(items) < PER_PAGE:
                      break
              if len(rules) != total:
                  raise ApiError("read %d deployment rules, expected %d" % (len(rules), total))
              return rules


          def matches_rule(pattern, name):
              """GitHub name patterns: '*' and '?' never match '/'."""
              regex = "".join(
                  "[^/]*" if char == "*" else "[^/]" if char == "?" else re.escape(char)
                  for char in pattern
              )
              return re.fullmatch(regex, name) is not None


          def deployment_rule_problems(rules, expected, tag):
              names = {"branch": [], "tag": []}
              for rule in rules:
                  if (
                      not isinstance(rule, dict)
                      or rule.get("type") not in names
                      or not isinstance(rule.get("name"), str)
                      or not rule["name"]
                  ):
                      return ["environment 'pypi' has a malformed deployment rule"]
                  names[rule["type"]].append(rule["name"])
              problems = []
              if names["branch"]:
                  problems.append(
                      "environment 'pypi' allows deployments from branches matching %s"
                      % ", ".join(sorted(names["branch"]))
                  )
              if names["tag"] != [expected]:
                  problems.append(
                      "environment 'pypi' tag rules are [%s], expected exactly [%s]"
                      % (", ".join(sorted(names["tag"])), expected)
                  )
              elif tag is not None and not matches_rule(expected, tag):
                  problems.append("tag %s is not allowed by the tag rule %s" % (tag, expected))
              return problems


          problems = []
          repository = os.environ["REPOSITORY"]
          expected_rule = os.environ["EXPECTED_TAG_RULE"]
          if os.environ["EVENT_NAME"] != "release" or os.environ["EVENT_ACTION"] != "published":
              problems.append("publication runs only for a published release")
          tag = None
          if os.environ["GIT_REF"].startswith("refs/tags/"):
              tag = os.environ["GIT_REF"][len("refs/tags/"):]
              if not RELEASE_TAG.fullmatch(tag):
                  problems.append(
                      "tag %s is not a release tag (vMAJOR.MINOR.PATCH, optionally"
                      " followed by aN, bN or rcN)" % tag
                  )
          else:
              problems.append("the release ref is not a tag")
          if repository != os.environ["EXPECTED_REPOSITORY"]:
              problems.append(
                  "repository %s is not the publishing repository %s"
                  % (repository, os.environ["EXPECTED_REPOSITORY"])
              )
          if os.environ["READINESS_FLAG"] != "ready":
              problems.append("repository variable PYPI_TRUSTED_PUBLISHING is not 'ready'")
          if not RULE_PATTERN.fullmatch(expected_rule):
              problems.append("EXPECTED_TAG_RULE %r is not a supported name pattern" % expected_rule)

          if not REPOSITORY_NAME.fullmatch(repository):
              problems.append("repository name %r is malformed" % repository)
          else:
              endpoint = "repos/%s/environments/pypi" % repository
              try:
                  environment = api_get(endpoint)
              except ApiError as error:
                  problems.append("environment 'pypi' could not be read: %s" % error)
              else:
                  if not isinstance(environment, dict) or environment.get("name") != "pypi":
                      problems.append("the API did not return environment 'pypi'")
                  else:
                      problems.extend(reviewer_problems(environment))
                      mode_problems = deployment_mode_problems(environment)
                      problems.extend(mode_problems)
                      if not mode_problems:
                          try:
                              rules = list_deployment_rules(endpoint + "/deployment-branch-policies")
                          except ApiError as error:
                              problems.append(
                                  "deployment rules of environment 'pypi' could not be read: %s" % error
                              )
                          else:
                              problems.extend(deployment_rule_problems(rules, expected_rule, tag))

          if problems:
              print("PyPI publication is not ready; nothing will be uploaded:")
              for problem in problems:
                  print("  - " + problem)
              print("See docs/publication-readiness.md.")
              sys.exit(1)
          print("All publication prerequisites checked by this workflow are in place.")
          PY

  # PyPI trusted publishing: a short-lived OIDC token replaces stored PyPI
  # credentials. Only this job can request an OIDC token, and only after the
  # tests, the build and the readiness check have passed for a published
  # release of the publishing repository.
  publish-pypi:
    name: Publish to PyPI
    needs:
      - test-pipeline
      - build-distributions
      - publication-readiness
    if: >-
      github.event_name == 'release'
      && github.event.action == 'published'
      && github.repository == 'Nike-Inc/brickflow'
      && startsWith(github.ref, 'refs/tags/')
      && vars.PYPI_TRUSTED_PUBLISHING == 'ready'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/brickflows/
    permissions:
      id-token: write # PyPI trusted publishing and PEP 740 attestations
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
