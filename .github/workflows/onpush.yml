name: build

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ main ]
  release:
    types: [ published ]

# Nothing is granted by default. Each job declares the permissions it needs.
# Actions are pinned to full commit SHAs and containers to image digests;
# Dependabot proposes updates (see .github/dependabot.yml). Publication rules
# and prerequisites are described in docs/publication-readiness.md.
permissions: {}

jobs:
  test-pipeline:
    name: test-pipeline (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
      options: --user 1001 # run as the runner user instead of root
    strategy:
      max-parallel: 2
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]
        os: [ ubuntu-latest ]
        include:
          - python-version: '3.9'
            image: python:3.9@sha256:da5aee29682d12a6649f51c8d6f15b87deb3e6c524b923c41d0cb3304d07c913
          - python-version: '3.10'
            image: python:3.10@sha256:c10791e6f69086d5216f7b5d3b839929c454e24305867ed9bc5152f0355b5423
          - python-version: '3.11'
            image: python:3.11@sha256:731670a425deabbc48d39f0ee3115cfa665b2a4002c19939ad3e88b2832b4549
          - python-version: '3.12'
            image: python:3.12@sha256:cad37dd20c7cac861af9003af8796d03ea7a998ec1e3a664429740fc9d7d2691

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK # used for py4j for cronutils
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install and configure Poetry (py3.9)
        if: matrix.python-version == '3.9'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: '1.8.5'

      - name: Install and configure Poetry
        if: matrix.python-version != '3.9'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Install poetry and build tools
        run: |
          export PATH=$PATH:$HOME/.local/bin
          poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install dependencies
        run: |
          export PATH=$PATH:$HOME/.local/bin
          make poetry

      - name: Install, lint and test
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export GITHUB_ACTIONS=true
          make cov

      # Pull requests from forks receive no secrets, so the token is empty there.
      - name: Publish test coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  # Builds and checks the distributions on every event, without any publishing
  # credential. On a release, the publish job uploads exactly these files.
  build-distributions:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: python:3.10@sha256:c10791e6f69086d5216f7b5d3b839929c454e24305867ed9bc5152f0355b5423
      options: --user 1001 # run as the runner user instead of root
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # poetry-dynamic-versioning derives the version from tags
          persist-credentials: false

      - name: Install build tools
        run: |
          python -m venv /tmp/build-tools
          /tmp/build-tools/bin/python -m pip install \
            "poetry==1.8.5" \
            "poetry-dynamic-versioning[plugin]==1.10.1" \
            "twine==7.0.0"

      - name: Build distributions
        run: |
          rm -rf dist
          /tmp/build-tools/bin/poetry build --no-interaction

      - name: Check distributions
        run: |
          ls -l dist
          /tmp/build-tools/bin/twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Fails a release run, with the reason, unless every publication prerequisite
  # is verifiably in place. A skipped publish would otherwise look like success.
  publication-readiness:
    name: Publication readiness
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the pypi environment's protection rules
    steps:
      - name: Read pypi environment settings
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=0
          gh api "repos/${REPOSITORY}/environments/pypi" > "${RUNNER_TEMP}/pypi-environment.json" || status=$?
          echo "Environment lookup exit status: ${status}"

      - name: Check publication readiness
        env:
          EXPECTED_REPOSITORY: Nike-Inc/brickflow
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          GIT_REF: ${{ github.ref }}
          READINESS_FLAG: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          python3 -I - "${RUNNER_TEMP}/pypi-environment.json" <<'PY'
          import json
          import os
          import sys

          problems = []
          if os.environ["EVENT_NAME"] != "release" or os.environ["EVENT_ACTION"] != "published":
              problems.append("publication runs only for a published release")
          if not os.environ["GIT_REF"].startswith("refs/tags/"):
              problems.append("the release ref is not a tag")
          if os.environ["REPOSITORY"] != os.environ["EXPECTED_REPOSITORY"]:
              problems.append(
                  "repository %s is not the publishing repository %s"
                  % (os.environ["REPOSITORY"], os.environ["EXPECTED_REPOSITORY"])
              )
          if os.environ["READINESS_FLAG"] != "ready":
              problems.append("repository variable PYPI_TRUSTED_PUBLISHING is not 'ready'")

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  environment = json.load(handle)
          except (OSError, ValueError):
              environment = None
          if not isinstance(environment, dict) or environment.get("name") != "pypi":
              problems.append("environment 'pypi' does not exist or could not be read")
          else:
              rules = environment.get("protection_rules") or []
              if not any(rule.get("reviewers") for rule in rules if isinstance(rule, dict)):
                  problems.append("environment 'pypi' has no required reviewers")
              if not environment.get("deployment_branch_policy"):
                  problems.append("environment 'pypi' allows deployments from every branch and tag")

          if problems:
              print("PyPI publication is not ready; nothing will be uploaded:")
              for problem in problems:
                  print("  - " + problem)
              print("See docs/publication-readiness.md.")
              sys.exit(1)
          print("All publication prerequisites checked by this workflow are in place.")
          PY

  # PyPI trusted publishing: a short-lived OIDC token replaces stored PyPI
  # credentials. Only this job can request an OIDC token, and only after the
  # tests, the build and the readiness check have passed for a published
  # release of the publishing repository.
  publish-pypi:
    name: Publish to PyPI
    needs:
      - test-pipeline
      - build-distributions
      - publication-readiness
    if: >-
      github.event_name == 'release'
      && github.event.action == 'published'
      && github.repository == 'Nike-Inc/brickflow'
      && startsWith(github.ref, 'refs/tags/')
      && vars.PYPI_TRUSTED_PUBLISHING == 'ready'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/brickflows/
    permissions:
      id-token: write # PyPI trusted publishing and PEP 740 attestations
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
